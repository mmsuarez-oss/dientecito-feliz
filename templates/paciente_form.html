{% extends 'base.html' %}
{% block titulo %}{{ 'Editar paciente' if pid else 'Nuevo paciente' }}{% endblock %}
{% block contenido %}
<header class="cabecera">
  <div>
    <a class="atras" href="{{ url_for('expediente', pid=pid) if pid else url_for('pacientes') }}">‹ Volver</a>
    <h1>{{ 'Editar paciente' if pid else 'Nuevo paciente' }}</h1>
  </div>
</header>

<form method="post" class="formulario">
  <fieldset class="tarjeta">
    <legend>Datos personales</legend>
    <div class="rejilla">
      <label class="ancho">Nombre completo *<input name="nombre" value="{{ p.nombre or '' }}" required autocomplete="off"></label>
      <label>Cédula *<input name="cedula" value="{{ p.cedula or '' }}" required placeholder="001-010190-0001A" autocomplete="off"></label>
      <label>Teléfono / WhatsApp<input name="telefono" type="tel" value="{{ p.telefono or '' }}" placeholder="8888 8888" inputmode="tel"></label>
      <label>Fecha de nacimiento<input name="nacimiento" type="date" value="{{ p.nacimiento or '' }}"></label>
      <label>Sexo
        <select name="sexo">
          {% for s in ['', 'Femenino', 'Masculino'] %}<option {{ 'selected' if s == (p.sexo or '') }}>{{ s }}</option>{% endfor %}
        </select>
      </label>
      <label class="ancho">Dirección<input name="direccion" value="{{ p.direccion or '' }}"></label>
      <label class="ancho">Contacto de emergencia<input name="contacto_emergencia" value="{{ p.contacto_emergencia or '' }}" placeholder="Nombre y teléfono"></label>
    </div>
  </fieldset>

  <fieldset class="tarjeta">
    <legend>Historia clínica</legend>
    <div class="rejilla">
      <label class="ancho">Motivo de consulta<textarea name="motivo_consulta" rows="2">{{ p.motivo_consulta or '' }}</textarea></label>
      <label class="ancho alerta-campo">⚠️ Alergias<input name="alergias" value="{{ p.alergias or '' }}" placeholder="Ej.: penicilina, látex. Deja vacío si no tiene"></label>
      <label class="ancho">Antecedentes médicos<textarea name="antecedentes" rows="3" placeholder="Enfermedades, cirugías, embarazo…">{{ p.antecedentes or '' }}</textarea></label>
      <label class="ancho">Medicamentos actuales<textarea name="medicamentos" rows="2">{{ p.medicamentos or '' }}</textarea></label>
      <label class="ancho">Examen clínico (extraoral e intraoral)<textarea name="examen_clinico" rows="3">{{ p.examen_clinico or '' }}</textarea></label>
      <label class="ancho">Diagnóstico y plan de tratamiento<textarea name="plan" rows="3">{{ p.plan or '' }}</textarea></label>
    </div>
  </fieldset>

  <div class="barra-guardar">
    <button class="btn primario grande">💾 Guardar</button>
  </div>
</form>
{% endblock %}
